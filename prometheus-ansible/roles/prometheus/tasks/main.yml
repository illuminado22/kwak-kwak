---
# Task 1 - Prepare the Server
- name: Update package repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install required utilities
  ansible.builtin.apt:
    name:
      - wget
      - tar
      - gzip
      - curl
    state: present

# Task 2 - Create the Prometheus User
- name: Create Prometheus system user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Verify Prometheus user
  ansible.builtin.command:
    cmd: "id {{ prometheus_user }}"
  register: prometheus_user_check
  changed_when: false

- name: Display Prometheus user information
  ansible.builtin.debug:
    var: prometheus_user_check.stdout

# Task 3 - Create Prometheus Directories
- name: Create Prometheus configuration directory
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"

- name: Create Prometheus data directory
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"

- name: Verify Prometheus directories
  ansible.builtin.command:
    cmd: "ls -ld {{ prometheus_config_dir }} {{ prometheus_data_dir }}"
  register: prometheus_directories
  changed_when: false

- name: Display Prometheus directory information
  ansible.builtin.debug:
    var: prometheus_directories.stdout

# Task 4 - Download Prometheus
- name: Download Prometheus archive
  ansible.builtin.get_url:
    url: "{{ prometheus_download_url }}"
    dest: "{{ prometheus_archive }}"
    mode: "0644"

- name: Verify downloaded Prometheus archive
  ansible.builtin.stat:
    path: "{{ prometheus_archive }}"
  register: prometheus_archive_check

- name: Extract Prometheus archive
  ansible.builtin.unarchive:
    src: "{{ prometheus_archive }}"
    dest: "/tmp"
    remote_src: true
    creates: "{{ prometheus_extract_dir }}"

- name: Verify extracted Prometheus directory
  ansible.builtin.command:
    cmd: "ls -la {{ prometheus_extract_dir }}"
  register: prometheus_extracted_files
  changed_when: false

- name: Display extracted Prometheus files
  ansible.builtin.debug:
    var: prometheus_extracted_files.stdout

# Task 5 - Install the Prometheus Binaries
- name: Copy Prometheus binary
  ansible.builtin.copy:
    src: "{{ prometheus_extract_dir }}/prometheus"
    dest: "{{ prometheus_install_dir }}/prometheus"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Copy promtool binary
  ansible.builtin.copy:
    src: "{{ prometheus_extract_dir }}/promtool"
    dest: "{{ prometheus_install_dir }}/promtool"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Verify Prometheus version
  ansible.builtin.command:
    cmd: "{{ prometheus_install_dir }}/prometheus --version"
  register: prometheus_version_check
  changed_when: false

- name: Display Prometheus version
  ansible.builtin.debug:
    var: prometheus_version_check.stdout

- name: Verify promtool version
  ansible.builtin.command:
    cmd: "{{ prometheus_install_dir }}/promtool --version"
  register: promtool_version_check
  changed_when: false

- name: Display promtool version
  ansible.builtin.debug:
    var: promtool_version_check.stdout

# Task 6 - Install Prometheus Configuration Files
- name: Copy Prometheus configuration
  ansible.builtin.copy:
    src: "{{ prometheus_extract_dir }}/prometheus.yml"
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    remote_src: true
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
  notify: Restart Prometheus

- name: Copy consoles directory
  ansible.builtin.copy:
    src: "{{ prometheus_extract_dir }}/consoles"
    dest: "{{ prometheus_config_dir }}/"
    remote_src: true
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
  notify: Restart Prometheus

- name: Copy console_libraries directory
  ansible.builtin.copy:
    src: "{{ prometheus_extract_dir }}/console_libraries"
    dest: "{{ prometheus_config_dir }}/"
    remote_src: true
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
  notify: Restart Prometheus

- name: Verify Prometheus configuration files
  ansible.builtin.command:
    cmd: "ls -la {{ prometheus_config_dir }}"
  register: prometheus_config_check
  changed_when: false

- name: Display Prometheus configuration files
  ansible.builtin.debug:
    var: prometheus_config_check.stdout

# Task 7 - Validate the Configuration
- name: Validate Prometheus configuration
  ansible.builtin.command:
    cmd: "{{ prometheus_install_dir }}/promtool check config {{ prometheus_config_dir }}/prometheus.yml"
  register: prometheus_config_validation
  changed_when: false

- name: Display Prometheus configuration validation
  ansible.builtin.debug:
    var: prometheus_config_validation.stdout

# Task 8 - Create the systemd Service
- name: Install Prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Prometheus

# Task 9 - Start and Enable Prometheus
- name: Enable Prometheus service
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    daemon_reload: true

- name: Start Prometheus service
  ansible.builtin.systemd_service:
    name: prometheus
    state: started

- name: Check Prometheus service status
  ansible.builtin.systemd_service:
    name: prometheus
  register: prometheus_service_status

- name: Display Prometheus service status
  ansible.builtin.debug:
    var: prometheus_service_status.status.ActiveState

# Task 10 - Verify Prometheus
- name: Check port 9090
  ansible.builtin.command:
    cmd: "ss -lntp"
  register: prometheus_ports
  changed_when: false

- name: Display listening ports
  ansible.builtin.debug:
    var: prometheus_ports.stdout

- name: Test Prometheus locally
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/"
    method: GET
    status_code: 200

- name: Check Prometheus readiness endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/-/ready"
    method: GET
    status_code: 200

- name: Check Prometheus version
  ansible.builtin.command:
    cmd: "{{ prometheus_install_dir }}/prometheus --version"
  register: final_prometheus_version
  changed_when: false

- name: Display final Prometheus version
  ansible.builtin.debug:
    var: final_prometheus_version.stdout

- name: Check final systemd status
  ansible.builtin.systemd_service:
    name: prometheus
  register: final_service_status

- name: Display final service state
  ansible.builtin.debug:
    msg: "Prometheus service state: {{ final_service_status.status.ActiveState }}"
